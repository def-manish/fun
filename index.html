<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question Browser</title>
    <link rel="stylesheet" href="style.css" title="" type="" />
    <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-1X283GZ74R"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}

  gtag('config', 'G-1X283GZ74R');

<body>
    <div class="container">
        <h1>Hi</h1>
        
        <div id="questionSection">
            <p class="question">I love you, do you love me ❤️</p>
            <div class="buttons">
                <button class="yes-btn" onclick="handleYes()">Yes</button>
                <button class="no-btn" onclick="handleYes()">No</button>
            </div>
        </div>

        <div id="yesResponse" class="response yes-response">
            <strong> 🥰🥰🥰 </strong><br><br>
            Thank you for understanding me.I wanna be your.
        </div>

        <div id="noResponse" class="response no-response">
            <strong>✗ No Problem!</strong><br><br>
            You chose NO. The action has been cancelled. No changes were made.
        </div>

        <!--<button class="reset-btn" id="resetBtn" onclick="resetQuestion()">Ask Again</button> -->
    </div>

    <script src="main.js" defer></script>
</body>
</html>
